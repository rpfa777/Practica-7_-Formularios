<!DOCTYPE html><!--Define el archivo como HTML-->
<html lang="en"><!--Establece el idioma en inglés-->
<head><!--Encabezado-->
<meta charset="UTF-8"><!--Permite mostrar acentos, la ñ y caracteres-->
<meta name="viewport" content="width=device-width, initial-scale=1.0"><!--Hace que la pagina se adapte al tamaño de pantalla de celulares-->
<title>Formularios en HTML</title><!--Es el titulo que aparece arriba en la pestaña del navegador-->
<!-- Libreria de iconos en linea -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-
awesome/7.3.1/css/all.min.css"><!--Conecta el código a una libreria de internet para poder meter íconos-->

</head><!--Se cierra encabezado-->
<body><!--Cuerpo de la página-->
<h2>Formularios con Radioboton</h2><!--Título de la página -->
<form action="" method="post"> <!--Contenedor de datos-->
Ingresa tu nombre:
<input type="text" name="nombre"> <!--Campo para ingresar el usuario-->
<br> <!--Salto de línea-->
Selecciona el maximo de estudios que tienes:
<br><!--Salto de línea-->
<!--Sección de selección de estudios que tiene el usuario-->
<input type="radio" name="estudios" value="1">Sin estudios <br><!-- Casilla de selección de Sin estudios -->
<input type="radio" name="estudios" value="2">Primaria <br><!-- Casilla de selección para Primaria -->
<input type="radio" name="estudios" value="3">Secundaria <br><!-- Casilla de selección para Secundaria -->
<input type="radio" name="estudios" value="4">Preparatoria <br><!-- Casilla de selección para Preparatoria -->
<input type="submit" value="enviar"> <!-- Botón para envíar respuestas -->
<input type="reset" value="borrar"> <!-- Botón para borrar o reiniciar -->
</form><!--Se cierra el formulario-->
</body><!--Se cierra el cuerpo-->
</html><!--Se cierra el archivo html-->
