<!DOCTYPE html><!--Define el archivo como HTML-->
<html lang="en"><!--Establece el idioma en español-->
<head><!--Encabezado-->
<meta charset="UTF-8"><!--Permite mostrar acentos, la ñ y caracteres-->
<meta name="viewport" content="width=device-width, initial-scale=1.0"><!--Hace que la pagina se adapte al tamaño de pantalla de celulares-->
<title>Formularios en HTML</title><!--Es el titulo que aparece arriba en la pestaña del navegador-->
<!-- Libreria de iconos en linea -->

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-
awesome/7.3.1/css/all.min.css"> <!--Conecta el código a una libreria de internet para poder meter íconos-->

</head><!--Se cierra encabezado-->
<body><!--Cuerpo de la página-->
<h2>Formulario para contraseñas</h2>
<form action="" method="post">

Ingresa tu usuario:
<input type="text" name="usuario"> <!--Campo para ingresar el usuario-->
Ingresa tu contraseña:
<input type="password" name="pass"> <!--Campo para ingresar contraseña-->
<br> <!--Salto de línea-->
<input type="submit" value="enviar"> <!--Botón para enviar-->
<input type="reset" value="borrar"> <!--Botón para borrar o reiniciar-->
</form><!--Se cierra el formulario-->
</body><!--Se cierra el cuerpo-->
</html><!--Se cierra el archivo html-->
