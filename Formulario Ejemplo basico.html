<!DOCTYPE html><!--Se define el archivo como html-->
<html lang="en"><!--Define el idioma del archivo al inglés-->
<head><!--Encabezado-->
<meta charset="UTF-8"><!--Permite mostrar acentos, la ñ y caracteres-->
<meta name="viewport" content="width=device-width, initial-scale=1.0"><!--Permite visualizar el archivo en celulares-->
<title>Formularios en HTML</title><!--Título de la página-->
<!-- Libreria de iconos en linea -->

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-
awesome/7.3.1/css/all.min.css"> <!--Conecta el código a una libreria de internet para poder meter íconos-->

</head><!--Se cierra encabezado-->
<body><!--Cuerpo de la página-->
<h2>Ejemplo basico</h2><!--Título-->
<form action="" method="post"><!--Contenedor de datos-->
Ingresa tu nombre:
<input type="text" name="nombre" size="20"> <!-- El tipo de letra que aparecerá al escribir -->
<br> <!--Salto de línea -->
<input type="submit" value="enviar"> <!-- El botón para envíar el texto escrito-->
</form> <!--Se cierra el formulario-->
</body><!--Se cierra el cuerpo-->
</html><!--Se cierra el archivo html-->
