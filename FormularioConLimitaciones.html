<!DOCTYPE html><!--Define el archivo como HTML-->
<html lang="en"><!--Establece el idioma en inglés-->
<head><!--Encabezado de la página-->
<meta charset="UTF-8"><!--Permite mostrar acentos, la ñ y caracteres especiales-->
<meta name="viewport" content="width=device-width, initial-scale=1.0"><!--Hace que la página se adapte al tamaño de pantalla de celulares-->
<title>Formularios en HTML</title><!--Es el título que aparece arriba en la pestaña del navegador-->
<!-- Libreria de iconos en linea -->

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"><!--Conecta el código a una librería de internet para poder meter íconos-->

</head><!--Se cierra encabezado-->
<body><!--Cuerpo de la página-->
	<h2>Formulario con limitaciones</h2><!--Título visible en la página-->
<form action="" method="post"><!--Contenedor para guardar y enviar los datos recopilados-->
Ingresa tu nombre:<!--Texto de indicación para el usuario-->
<!-- Desahbilitacion de campo -->
<input type="text" name="nombre" disabled><br><!--Campo de texto deshabilitado para que no se pueda modificar y salto de línea-->
<!-- Limitacion de caracteres -->
Contraseña:<!--Texto de indicación para el usuario-->
<input type="password" name="pass" maxlength="5"><br><!--Campo de contraseña oculto limitado a 5 caracteres y salto de línea-->
<!-- Solo lectura -->
Comentarios:<!--Texto de indicación para el usuario-->
<textarea name="comentarios" readonly><!--Caja para texto largo en modo solo lectura-->

Este es mi comentario y no se puede borrar<!--Texto fijo que aparece dentro del campo-->
</textarea><br><!--Se cierra la caja de texto y salto de línea-->
</form><!--Se cierra el formulario-->
</body><!--Se cierra el cuerpo-->
</html><!--Se cierra el archivo html-->
